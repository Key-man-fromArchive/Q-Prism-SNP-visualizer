<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <meta name="description" content="Q-Prism® Cluster Caller parses and analyzes raw ASG-PCR (allele-specific genotyping PCR) data to extract and summarize SNP genotyping results from instrument output.">
    <meta name="keywords" content="Q-Prism, Q-Prism Cluster Caller, ASG-PCR, SNP discrimination, allele-specific genotyping PCR, SNP analysis, genotyping data parser, SNP calling, raw data analyzer, Invirustech">
    <!-- Served behind an ASG Designer launch, so there is nothing a search
         engine should index here; the canonical it used to carry pointed at
         snpanalyze.ivttools.com, which no longer answers (502). -->
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Q-Prism® Cluster Caller | IVTTools">
    <meta property="og:description" content="Q-Prism® Cluster Caller parses and summarizes SNP genotyping results from raw ASG-PCR instrument data.">
    <title>Q-Prism® Cluster Caller</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var storageKey = "__asg_launch_token";
        var url = new URL(window.location.href);
        var token = url.searchParams.get("token");

        if (!token && url.hash) {
          var hashParams = new URLSearchParams(url.hash.slice(1));
          token = hashParams.get("token");
          hashParams.delete("token");
          var nextHash = hashParams.toString();
          url.hash = nextHash ? "#" + nextHash : "";
        }

        if (!token) return;

        url.searchParams.delete("token");
        try {
          window.sessionStorage.setItem(storageKey, token);
        } catch (err) {
          window.__ASG_LAUNCH_TOKEN__ = token;
        }
        window.history.replaceState({}, document.title, url.pathname + url.search + url.hash);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
